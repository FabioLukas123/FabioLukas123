<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05060a" />
  <title>GOTHAM — A Dark Deco Reel</title>
  <meta name="description" content="Um curta animado interativo em estética Dark Deco — atmosfera, ilustração, movimento e jazz gerado ao vivo." />
  <meta property="og:title" content="GOTHAM — A Dark Deco Reel" />
  <meta property="og:description" content="Steel and shadow. Somewhere below, a band is already playing." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070810'/%3E%3Cpath d='M16 3 L21 11 L18 11 L18 29 L14 29 L14 11 L11 11 Z' fill='%23c9a14a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- the stage where scenes cross-dissolve -->
  <div id="stage" class="stage"></div>

  <!-- atmosphere canvas: rain, fog, beams, smoke, vignette -->
  <canvas id="fx" class="fx"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>

  <!-- diegetic HUD -->
  <div id="hud" class="hud" aria-hidden="true">
    <div class="hud__corner tl"></div><div class="hud__corner tr"></div>
    <div class="hud__corner bl"></div><div class="hud__corner br"></div>
    <div class="hud__progress"><i id="bar"></i></div>
    <div id="chapter" class="hud__chapter">I · GOTHAM</div>
    <div class="hud__controls">
      <span><kbd>→</kbd> / <kbd>espaço</kbd> avançar</span>
      <span><kbd>←</kbd> voltar</span>
      <button id="sound" class="hud__btn" type="button">SOUND ♪</button>
    </div>
  </div>

  <!-- the overture gate -->
  <div id="gate" class="gate">
    <div class="gate__frame">
      <div class="gate__rule"></div>
      <div class="gate__kicker">A LOST REEL · EST. MCMXXXIX</div>
      <h1 class="gate__title">GOTHAM</h1>
      <div class="gate__sub">A&nbsp;DARK&nbsp;DECO&nbsp;REEL</div>
      <div class="gate__rule"></div>
      <p class="gate__blurb">
        Steel and shadow. A thousand lit windows and no one at home.
        Somewhere below, a band is already playing.
      </p>
      <button id="enter" class="gate__enter" type="button"><span>ROLL THE FILM</span></button>
      <div class="gate__hint">fones recomendados · som ligado</div>
    </div>
    <div id="loadbar" class="loadbar"><i></i></div>
  </div>

  <script type="module" src="./dist/city.bundle.js"></script>
  <noscript><div class="noscript">Este curta é feito de luz e código. Ative o JavaScript para assistir.</div></noscript>
</body>
</html>
